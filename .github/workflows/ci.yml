# ============================================================================
# 安妮播放器融合版V3 · 日常提交快速检查（V3.5.17）
# 触发：push 到 main / PR。1 分钟内完成，防坏语法/坏编译进主干。
# 发版打包走 release.yml（tag v* 触发），本工作流不出包。
# ============================================================================
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JS 语法检查（node --check 全量）
        run: node scripts/check-syntax.js

      - name: README 说明书章节同步检查
        run: node scripts/gen-readme-help.js --check

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 用 publish（而非 build）：产物放 engine/publish，与 tools/ffmpeg 的相对位置和发版一致
      - name: 引擎编译（dotnet publish 单文件）
        run: dotnet publish engine/src -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o engine/publish --nologo

      # V4：音频正确性测试集（lavfi 生成测试音 → test.decode 拉取 DSP 链断言）
      - name: 准备 ffmpeg
        run: node scripts/setup-tools.js

      - name: 音频正确性测试（DSP 链断言）
        run: npm run test:audio

      - name: 音源沙箱安全验证（逃逸阻断端到端）
        run: npm run test:sandbox
