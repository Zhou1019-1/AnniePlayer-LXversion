# ============================================================================
# 安妮播放器 · macOS 版云端构建发布（macOS 线专用）
# 触发：push 一个 mac-v* 标签（如 git tag mac-v1.0.0 && git push origin mac-v1.0.0）
#       或在 GitHub Actions 页面手动 Run workflow
# 工程：原生 Swift（AppKit 外壳 + WKWebView + 原生音频引擎），非 Electron。
# 流程：swiftc 编译 → build-dmg.sh 打 DMG/ZIP → 发布 Release（prerelease，见下）
# 维护边界：本 workflow 只许动 macOS 线；Windows 主线是 release.yml，禁止混改。
# ⚠️ prerelease: true 是硬规则（防止抢走 releases/latest 指针打断 Windows 用户
#    自动更新），mac 自动更新通道方案落地前不得移除。详见 macos/AGENTS.md 第二节。
# ============================================================================
name: release-mac

on:
  push:
    tags: ['mac-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ===== Swift 工程构建（按 numb 提供的构建方式，只允许改本文件） =====
      # macos/ 目录结构：src/*.swift + build-dmg.sh（打 DMG/ZIP 的脚本）
      # 若工程结构调整（如改 SwiftPM / Xcode 工程），改这里对应命令即可，
      # 但「产物流向 GitHub Release + prerelease」的规矩不变。

      - name: 编译 Swift 工程（arm64，release）
        working-directory: macos
        run: |
          mkdir -p build
          swiftc -O -parse-as-library -target arm64-apple-macosx15.0 \
            -o build/annie src/*.swift

      - name: 打包 DMG / ZIP
        working-directory: macos
        run: |
          ver="${GITHUB_REF_NAME#mac-v}"
          [ -n "$ver" ] || ver="0.0.0-dev"
          chmod +x build-dmg.sh
          ./build-dmg.sh "$ver"

      - name: 提取本版 release notes（macos/更新日志-mac.md）
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#mac-v}"
          echo "RELVER=$ver" >> "$GITHUB_ENV"
          awk -v v="## V$ver" 'BEGIN{f=0} index($0,v)==1{f=1;next} /^## V/&&f{exit} f' macos/更新日志-mac.md > release-notes-mac.md || true
          [ -s release-notes-mac.md ] || echo "安妮播放器 macOS 版 V$ver" > release-notes-mac.md

      - name: 列出产物（核对用）
        shell: bash
        run: |
          find macos/dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -exec ls -lh {} \;

      - name: 发布到 GitHub Release（prerelease，勿改）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 安妮播放器 macOS 版 V${{ env.RELVER }}
          body_path: release-notes-mac.md
          prerelease: true   # ⚠️ 硬规则：防止抢 releases/latest 指针（见顶部注释）
          # ⚠️ 只收 dist/ 下 build-dmg.sh 的产物。不要加 macos/build/*.zip——
          # build-dmg.sh 会把下载的 wrapper-lite.zip 临时留在 build/，glob 宽了会误传（已踩）。
          files: |
            macos/dist/*.dmg
            macos/dist/*.zip

# ============================================================================
# 备注：ubuntu.img（588MB）与 limactl（31MB）是 AM 解密 VM 的运行时依赖，
# 不随每次发版重复上传——仿照 wrapper-lite 的做法，单独打一个固定 tag 的
# 资产 Release（同样必须 prerelease），VMInstaller.swift 里写死该下载地址。
# ============================================================================
