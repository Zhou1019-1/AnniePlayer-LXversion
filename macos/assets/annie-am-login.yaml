# 安妮播放器 —— Apple Music 登录服务 VM（最小化）
# 用途：只运行 am-login-server（支持两阶段 2FA 登录），不装 QQ/Docker 等无关服务。
minimumLimaVersion: 2.0.0
vmType: "vz"
arch: "aarch64"
cpus: 2
memory: "2GiB"
disk: "8GiB"
propagateProxyEnv: false
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
mounts: []
containerd:
  system: false
  user: false
